<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단답형 모의고사</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--line:#e3e6ec;--accent:#3b5bdb;--ok:#2b8a3e;--okbg:#ebfbee;--bad:#c92a2a;--badbg:#fff5f5;--code:#eef0f4}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1d2027;--text:#e8eaf0;--muted:#98a1b3;--line:#2c313b;--accent:#8ea2ff;--ok:#69db7c;--okbg:#17301d;--bad:#ff8787;--badbg:#3a1c1c;--code:#2a2f3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 18px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 10px;margin-bottom:10px}
.q{font-size:18px;font-weight:600;margin:0 0 16px}
code{background:var(--code);padding:1px 6px;border-radius:5px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#14161b}}
button:disabled{opacity:.5;cursor:default}
.fb{margin-top:18px;border-radius:12px;padding:14px 16px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.verdict{font-weight:700;font-size:17px;margin-bottom:6px}
.ok .verdict{color:var(--ok)}.bad .verdict{color:var(--bad)}
.line{margin:4px 0}
.exp{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.exp p{margin:6px 0}
.link{background:none;border:none;padding:0;color:var(--muted);font-weight:400;text-decoration:underline;font-size:14px}
.res h2{margin:0 0 4px}
.big{font-size:34px;font-weight:800}
.area{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px}
.area span:first-child{width:140px;flex:none}
.area .bar{flex:1;margin:0}
.wr{margin:6px 0;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Python·Git 단답형 모의고사</h1>
  <div class="sub">코디세이 미션 "컴퓨터에게 명령 내리는 말(파이썬) 처음 배우기" · 영역별 3문제 · 답을 제출하면 바로 해설이 나옵니다</div>
  <div class="bar"><i id="prog"></i></div>
  <div id="app"></div>
</div>
<script>
const GROUPS = [{"name": "Python 기초", "qs": [{"q": "`age = input(\"나이: \")`에서 사용자가 `20`을 입력했다. `age`에 저장되는 값의 자료형은?", "show": "str (문자열)", "accept": [["str", "문자열", "string"]], "exp": "`input()`은 무엇을 입력하든 항상 **문자열(str)** 을 돌려줍니다.\n숫자로 쓰려면 `int(age)`로 변환해야 하고, 변환에 실패하면 `ValueError`가 납니다. (미션의 '숫자 변환 실패 시 재입력' 요구와 연결)\n참고: int=정수, str=문자열, bool=참/거짓, list=순서 있는 목록, dict=키-값 쌍."}, {"q": "`{\"question\": \"Python의 창시자는?\", \"answer\": 1}`처럼 키(key)와 값(value)을 쌍으로 저장하는 자료형은?", "show": "dict (딕셔너리)", "accept": [["dict", "딕셔너리", "딕트"]], "exp": "**dict**는 키로 값을 찾는 자료형입니다. `state.json`의 구조(`\"quizzes\"`, `\"best_score\"` 같은 키)가 바로 dict입니다.\n**list**는 순서가 있는 목록(`quizzes`의 퀴즈 여러 개)이고, 인덱스(0, 1, 2…)로 접근합니다."}, {"q": "함수가 계산한 결과를 호출한 곳으로 돌려줄 때 사용하는 키워드는?", "show": "return", "accept": [["return", "리턴"]], "exp": "**매개변수**는 함수로 들어가는 입력, **반환값(`return`)** 은 함수가 돌려주는 출력입니다.\n`print()`는 화면에 보여 줄 뿐 값을 돌려주지 않습니다. `return`이 없으면 함수는 `None`을 돌려줍니다."}]}, {"name": "클래스·객체", "qs": [{"q": "객체가 만들어질 때 자동으로 호출되어 속성의 초기값을 정해 주는 특별한 메서드의 이름은?", "show": "__init__ (생성자)", "accept": [["__init__", "init", "생성자"]], "exp": "`Quiz(\"문제\", [...], 2)`처럼 객체를 만드는 순간 **`__init__`** 이 자동 실행되어 `self.question = question` 같은 초기 설정을 합니다.\n클래스는 **설계도**, 객체는 그 설계도로 만든 실물입니다."}, {"q": "메서드의 첫 번째 매개변수로, 객체 자기 자신을 가리키는 관례적인 이름은?", "show": "self", "accept": [["self", "셀프"]], "exp": "**`self`** 는 '지금 이 객체'입니다. `self.question`은 '내 문제'라는 뜻입니다.\n정의할 때는 `def show(self)`처럼 적지만, 호출할 때는 `q.show()`처럼 쓰고 `self`는 파이썬이 자동으로 넣어 줍니다.\n객체마다 `self`가 달라서 속성값이 서로 독립적입니다."}, {"q": "클래스 안에서 객체가 가진 데이터(예: `question`)를 (①), 객체가 하는 행동(예: `show()`)을 (②)라고 한다. ①, ②는?", "show": "① 속성(attribute), ② 메서드(method)", "accept": [["속성", "attribute"], ["메서드", "method", "메소드"]], "exp": "**속성(attribute)** = 객체가 가진 데이터(변수), **메서드(method)** = 객체가 할 수 있는 행동(함수)입니다.\nQuiz 클래스라면 속성은 `question, choices, answer`, 메서드는 퀴즈 출력·정답 확인 등입니다."}]}, {"name": "파일·JSON·예외", "qs": [{"q": "프로그램을 종료하고 다시 실행해도 퀴즈와 최고 점수가 유지되는 성질(파일 저장으로 얻는 성질)을 무엇이라 하는가?", "show": "데이터 영속성", "accept": [["영속", "persist"]], "exp": "**데이터 영속성**: 프로그램이 꺼져도 데이터가 남아 있는 성질입니다. 변수는 종료하면 사라지지만 **파일**에 저장하면 남습니다.\n**JSON**은 dict/list 같은 구조를 텍스트로 저장하기 쉬운 형식이라 `state.json`에 사용합니다. (읽기 `json.load`, 쓰기 `json.dump`)"}, {"q": "파일이 없거나 손상되었을 때도 프로그램이 멈추지 않도록 오류를 처리하는 구문은?", "show": "try/except", "accept": [["try", "except"]], "exp": "`try:` 안에서 오류가 날 수 있는 코드를 실행하고, 오류가 나면 `except:`로 넘어가 처리합니다.\n미션 요구: 파일이 없으면 기본 퀴즈 데이터 사용, 손상되었으면 안내 메시지 후 기본 데이터로 복구."}, {"q": "`int(\"abc\")`처럼 숫자로 바꿀 수 없는 문자열을 변환하면 발생하는 예외의 이름은?", "show": "ValueError", "accept": [["valueerror"]], "exp": "**`ValueError`** 입니다. 메뉴 입력 처리에서 `except ValueError:`로 잡아 안내 메시지를 출력하고 재입력받습니다.\n함께 알아둘 것: Ctrl+C → `KeyboardInterrupt`, 입력 스트림 종료 → `EOFError`. (잘못된 JSON은 `json.JSONDecodeError`이고 이것도 `ValueError`의 하위 예외)"}]}, {"name": "Git ① 기록 흐름", "qs": [{"q": "변경한 파일을 다음 커밋에 포함시키기 위해 스테이징 영역에 올리는 Git 명령은?", "show": "git add", "accept": [["add"]], "exp": "**`git add`** : 변경 파일을 스테이징(커밋 대기) 영역에 올립니다.\n흐름: 작업 폴더 → `add` → 스테이징 → `commit` → 로컬 저장소 → `push` → 원격 저장소(GitHub)"}, {"q": "스테이징한 변경을 메시지와 함께 로컬 저장소에 기록하는 Git 명령은?", "show": "git commit", "accept": [["commit", "커밋"]], "exp": "**`git commit -m \"Feat: 퀴즈 출제 기능 구현\"`** : 변경 이력을 하나의 기록(스냅샷)으로 남깁니다.\n권장 메시지 형식은 `Feat:`, `Fix:`, `Docs:`, `Refactor:`처럼 작업 내용을 드러내는 것입니다. (최소 10개 이상의 의미 있는 커밋)"}, {"q": "로컬에 기록된 커밋을 GitHub 같은 원격 저장소에 올리는 Git 명령은?", "show": "git push", "accept": [["push", "푸시"]], "exp": "**`git push`** : 로컬 커밋을 원격 저장소로 업로드합니다.\n반대로 원격의 변경을 가져오는 것은 `git pull`입니다. (`git init`은 저장소를 새로 시작하는 명령)"}]}, {"name": "Git ② 브랜치·원격", "qs": [{"q": "브랜치를 이동(전환)할 때 쓰는 명령이다. `-b` 옵션을 붙이면 새 브랜치를 만들면서 이동한다. 이 명령은?", "show": "git checkout (최신 Git에서는 git switch도 사용)", "accept": [["checkout", "switch"]], "exp": "**`git checkout 브랜치명`** 은 이동, **`git checkout -b 브랜치명`** 은 새로 만들면서 이동입니다.\n미션 요구: `main` 외에 추가 브랜치를 만들어 작업한 뒤 `main`으로 병합."}, {"q": "작업을 마친 브랜치의 변경을 main 브랜치로 합칠 때(main에서 실행) 쓰는 명령은?", "show": "git merge", "accept": [["merge", "병합"]], "exp": "`git checkout main` 으로 main으로 이동한 뒤 **`git merge 작업브랜치`** 로 합칩니다.\n미션 요구: 최소 1회 이상 브랜치 생성 및 병합(checkout, merge) 기록."}, {"q": "(①) 원격 저장소를 로컬에 처음 복제하는 명령, (②) 이미 복제한 저장소에서 원격의 새 변경사항을 가져오는 명령은? 쉼표로 구분해 쓰세요.", "show": "① git clone, ② git pull", "accept": [["clone"], ["pull"]], "exp": "**`git clone 주소`** : 원격 저장소를 통째로 복제(처음 1회). **`git pull`** : 원격의 최신 변경을 가져와 로컬에 반영(fetch + merge).\n13단계 실습: 별도 폴더에 `clone` → 수정 → `commit`·`push` → 원래 폴더에서 `pull`로 확인."}]}, {"name": "과제 규칙", "qs": [{"q": "Quiz 클래스가 가져야 하는 속성 3가지를 영어로 쓰세요. (쉼표로 구분)", "show": "question, choices, answer", "accept": [["question", "문제"], ["choices", "선택지"], ["answer", "정답"]], "exp": "**question(문제), choices(선택지), answer(정답)**. 선택지는 4개가 기본이고, 정답은 1~4 중 하나의 번호로 관리하는 방식을 권장합니다.\n클래스는 최소 2개(예: Quiz, QuizGame). QuizGame은 퀴즈 목록·최고 점수 등을 관리하고 메뉴·풀기·추가·목록·점수·저장/불러오기 메서드를 가집니다."}, {"q": "퀴즈 목록과 최고 점수를 저장하는, 프로젝트 루트에 둘 데이터 파일의 이름은?", "show": "state.json (UTF-8 인코딩 권장)", "accept": [["state.json", "statejson"]], "exp": "**`state.json`** : 최소 스키마는 `quizzes`(퀴즈 목록)와 `best_score`(최고 점수)입니다. UTF-8 인코딩을 권장합니다.\n파일이 없으면(첫 실행) 기본 퀴즈 데이터를 사용하고, 손상되면 안내 후 복구합니다."}, {"q": "제출물 중, 커밋 이력을 한 줄 그래프로 보여 주는 스크린샷에 사용하는 Git 명령은? (옵션까지 쓰세요)", "show": "git log --oneline --graph", "accept": [["log"]], "exp": "**`git log --oneline --graph`** : 커밋을 한 줄씩, 브랜치 병합 흐름을 그래프로 보여 줍니다.\n제출물: GitHub 저장소 URL, 개발 환경 스크린샷, 프로그램 실행 결과 스크린샷(추가·목록·플레이·점수), 위 `git log` 스크린샷."}]}];
const ALL = [];
GROUPS.forEach((g,gi)=>g.qs.forEach((q,qi)=>ALL.push({...q,area:g.name,gi,qi})));

const norm = s => s.toLowerCase().replace(/[\s`'"“”‘’()\[\]{},]/g,'');
function judge(q, input){
  const n = norm(input);
  if(!n) return false;
  return q.accept.every(group => group.some(a => n.includes(norm(a))));
}
// `코드`와 **굵게**를 안전하게 렌더링
function inline(parent, text){
  text.split(/(`[^`]+`)/).forEach(part=>{
    if(!part) return;
    if(part.startsWith('`')){const c=document.createElement('code');c.textContent=part.slice(1,-1);parent.append(c);}
    else parent.append(part);
  });
}
function rich(text){
  const frag = document.createDocumentFragment();
  text.split('\n').forEach(line=>{
    const p = document.createElement('p'); p.className='line';
    line.split(/(\*\*[^*]+\*\*)/).forEach(part=>{
      if(!part) return;
      if(part.startsWith('**')){const b=document.createElement('b'); inline(b, part.slice(2,-2)); p.append(b);}
      else inline(p, part);
    });
    frag.append(p);
  });
  return frag;
}
const $ = (t,cls,txt)=>{const e=document.createElement(t); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;};

let queue = ALL.map((_,i)=>i), pos = 0, results = {}; // results[i] = {ok, mine}
const app = document.getElementById('app'), prog = document.getElementById('prog');

function showQuestion(){
  app.replaceChildren();
  if(pos >= queue.length) return showResult();
  prog.style.width = (pos/queue.length*100)+'%';
  const q = ALL[queue[pos]];
  const card = $('div','card');
  card.append($('span','tag', `${q.area} · ${q.qi+1}/3  (전체 ${pos+1}/${queue.length})`));
  const qp = $('p','q'); qp.append(...rich(q.q).querySelector('p').childNodes); card.append(qp);
  const inp = $('input'); inp.type='text'; inp.placeholder='답을 입력하고 Enter'; inp.autocomplete='off'; inp.spellcheck=false;
  const row = $('div','row');
  const submit = $('button','primary','제출'); const skip = $('button',null,'모르겠어요');
  row.append(submit, skip);
  const fb = $('div'); 
  card.append(inp,row,fb); app.append(card); inp.focus();

  function finish(mine, ok, skipped){
    results[queue[pos]] = {ok, mine};
    inp.disabled = submit.disabled = skip.disabled = true;
    fb.className = 'fb ' + (ok?'ok':'bad'); fb.replaceChildren();
    fb.append($('div','verdict', ok ? '✅ 정답입니다!' : (skipped ? '❌ 모르겠음 → 오답 처리' : '❌ 오답입니다')));
    if(!skipped) fb.append($('div','line', '내 답: ' + mine));
    const ans = $('div','line'); ans.append('정답: ', Object.assign($('b'),{textContent:q.show})); fb.append(ans);
    const exp = $('div','exp'); exp.append(rich(q.exp)); fb.append(exp);
    const fix = $('button','link', ok ? '채점이 틀렸어요 (오답으로 바꾸기)' : '내 답도 맞는 표현이에요 (정답으로 바꾸기)');
    fix.onclick = ()=>{results[queue[pos]].ok = !results[queue[pos]].ok; finish(mine, results[queue[pos]].ok, skipped);};
    const next = $('button','primary', pos+1>=queue.length ? '결과 보기' : '다음 문제');
    next.onclick = ()=>{pos++; showQuestion();};
    const r2 = $('div','row'); r2.append(next, fix); fb.append(r2);
    next.focus();
  }
  const go = ()=>{ if(!inp.value.trim()){inp.focus();return;} finish(inp.value.trim(), judge(q,inp.value), false); };
  submit.onclick = go; skip.onclick = ()=>finish('', false, true);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); if(!inp.disabled) go(); } });
}

function showResult(){
  prog.style.width='100%';
  app.replaceChildren();
  const card = $('div','card res');
  const total = queue.length, okc = queue.filter(i=>results[i]&&results[i].ok).length;
  card.append($('h2',null,'결과'));
  card.append($('div','big', `${okc} / ${total}`));
  card.append($('div','sub', okc===total ? '만점입니다! 🎉' : '틀린 문제만 다시 풀어 보세요.'));
  GROUPS.forEach(g=>{
    const idx = queue.filter(i=>ALL[i].area===g.name);
    if(!idx.length) return;
    const k = idx.filter(i=>results[i]&&results[i].ok).length;
    const a = $('div','area'); a.append($('span',null,g.name));
    const bar=$('div','bar'); const f=$('i'); f.style.width=(k/idx.length*100)+'%'; bar.append(f); a.append(bar, $('span',null,`${k}/${idx.length}`));
    card.append(a);
  });
  const wrong = queue.filter(i=>!(results[i]&&results[i].ok));
  if(wrong.length){
    card.append($('h3',null,'틀린 문제 복습'));
    wrong.forEach(i=>{
      const d=$('div','wr'); d.append(`[${ALL[i].area}] `); d.append(...rich(ALL[i].q).querySelector('p').childNodes);
      d.append(' → '); const b=$('b',null,ALL[i].show); d.append(b); card.append(d);
    });
  }
  const row=$('div','row');
  if(wrong.length){const b=$('button','primary',`틀린 ${wrong.length}문제 다시 풀기`); b.onclick=()=>{queue=wrong; pos=0; results={}; showQuestion();}; row.append(b);}
  const all=$('button',null,'처음부터 다시'); all.onclick=()=>{queue=ALL.map((_,i)=>i); pos=0; results={}; showQuestion();}; row.append(all);
  card.append(row); app.append(card);
}
showQuestion();
</script>
</body>
</html>
