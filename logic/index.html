<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀴즈와 퍼즐 게임으로 배우는 논리학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{
  --bg:#F5F3EE; --panel:#FFFFFF; --side:#1F2A44; --side-ink:#C9D1E3; --side-hi:#FFFFFF;
  --ink:#1C2333; --ink-soft:#5B6478; --line:#E3DFD6; --accent:#C8553D; --accent-soft:#F6E1DA;
  --ok:#2E8B57; --ok-soft:#DDF0E4; --bad:#C0392B; --bad-soft:#F7DEDB; --chip:#EEF0F5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161F; --panel:#1B2130; --side:#0D111A; --side-ink:#9AA4BA; --side-hi:#FFFFFF;
  --ink:#E7EAF1; --ink-soft:#A2AABC; --line:#2C3445; --accent:#E57A60; --accent-soft:#3A2722;
  --ok:#5CC08A; --ok-soft:#1E3529; --bad:#EF7B6E; --bad-soft:#3A2220; --chip:#252C3D; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161F; --panel:#1B2130; --side:#0D111A; --side-ink:#9AA4BA; --side-hi:#FFFFFF;
  --ink:#E7EAF1; --ink-soft:#A2AABC; --line:#2C3445; --accent:#E57A60; --accent-soft:#3A2722;
  --ok:#5CC08A; --ok-soft:#1E3529; --bad:#EF7B6E; --bad-soft:#3A2220; --chip:#252C3D; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.7}
.app{display:flex;min-height:100vh}

/* ---------- 사이드바 ---------- */
.side{width:280px;flex-shrink:0;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.brand small{display:block;font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.brand b{display:block;color:var(--side-hi);font-family:"Noto Serif KR",serif;font-size:17px;line-height:1.45;margin-top:6px}
nav{padding:12px 10px 24px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;color:inherit;
  font:inherit;font-size:14.5px;text-align:left;border-radius:8px;cursor:pointer}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--side-hi)}
.nav-item.active{background:rgba(255,255,255,.1);color:var(--side-hi);font-weight:700}
.nav-item .ico{width:22px;text-align:center;flex-shrink:0}
.nav-item .caret{margin-left:auto;transition:transform .2s;font-size:11px;opacity:.7}
.group.open > .nav-item .caret{transform:rotate(90deg)}
.sub{display:none;padding:2px 0 6px 34px}
.group.open .sub{display:block}
.sub button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:0;background:none;color:inherit;
  font:inherit;font-size:13.5px;text-align:left;border-radius:6px;cursor:pointer}
.sub button:hover{color:var(--side-hi);background:rgba(255,255,255,.05)}
.sub button.active{color:var(--side-hi);background:rgba(255,255,255,.1)}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);flex-shrink:0}
.dot.ready{background:var(--accent)} .dot.done{background:var(--ok)}
.nav-label{font-size:11px;letter-spacing:.1em;padding:16px 12px 6px;opacity:.55}
.side-foot{padding:14px 20px;font-size:12px;border-top:1px solid rgba(255,255,255,.08);opacity:.7}

/* ---------- 메인 ---------- */
main{flex:1;min-width:0}
.topbar{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--side);color:#fff;position:sticky;top:0;z-index:20}
.topbar button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:0 4px}
.topbar span{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{max-width:1040px;margin:0 auto;padding:36px 32px 64px}
.crumb{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
h1{font-family:"Noto Serif KR",serif;font-size:30px;line-height:1.35;margin:0 0 8px}
h2{font-size:20px;margin:36px 0 14px}
.lead{color:var(--ink-soft);margin:0 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}

.hero{background:linear-gradient(135deg,#1F2A44 0%,#34446B 100%);color:#fff;border-radius:18px;padding:36px 36px 32px;position:relative;overflow:hidden}
.hero small{color:#F2A58F;font-weight:700;letter-spacing:.12em;font-size:12px}
.hero h1{color:#fff;font-size:32px;margin:10px 0 12px}
.hero p{margin:0;max-width:640px;color:#D5DBEA}
.hero .btns{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;border:1px solid transparent;
  font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.line{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.stat b{font-size:28px;display:block;line-height:1.2}
.stat span{font-size:13px;color:var(--ink-soft)}
.bar{height:6px;background:var(--chip);border-radius:6px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ch{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:transform .15s,border-color .15s;text-align:left;font:inherit;color:inherit}
.ch:hover{transform:translateY(-2px);border-color:var(--accent)}
.ch .n{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.ch h3{margin:4px 0 6px;font-size:17px}
.ch p{margin:0;font-size:13.5px;color:var(--ink-soft)}
.ch .meta{margin-top:12px;font-size:12px;color:var(--ink-soft)}

/* 저자 소개 */
.author{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
.author img{width:220px;height:220px;object-fit:cover;border-radius:16px;border:1px solid var(--line);display:block}
.author .name{font-family:"Noto Serif KR",serif;font-size:26px;font-weight:700;margin:0}
.author .role{color:var(--ink-soft);font-size:14px;margin:2px 0 16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tag{background:var(--chip);border-radius:20px;padding:4px 12px;font-size:12.5px}
.tag.hi{background:var(--accent-soft);color:var(--accent);font-weight:700}
.books{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:0;padding:0;list-style:none}
.books li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.books li em{font-style:normal;font-weight:700}
.books li .pub{display:block;font-size:12.5px;color:var(--ink-soft)}
.kind{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:4px;background:var(--chip);color:var(--ink-soft);margin-left:6px;vertical-align:2px}

/* 게임 */
.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pill{font-size:12.5px;background:var(--chip);border-radius:20px;padding:4px 12px;color:var(--ink-soft)}
.q{font-size:18px;font-weight:500;margin:0 0 18px}
.q .pass{display:block;background:var(--chip);border-left:4px solid var(--accent);padding:14px 16px;border-radius:8px;font-size:16px;margin-top:10px;line-height:1.8}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--chip);font-size:14.5px;display:none}
.explain.show{display:block}
.game-foot{display:flex;justify-content:flex-end;margin-top:18px}
.result{text-align:center;padding:20px 0}
.result .big{font-size:52px;font-weight:900;color:var(--accent);line-height:1.1}
.soon{text-align:center;padding:48px 20px;color:var(--ink-soft)}
.soon .big{font-size:44px}

@media (max-width:860px){
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .side.open{transform:none}
  .topbar{display:flex}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .scrim.show{display:block}
  .content{padding:22px 16px 48px}
  .hero{padding:26px 20px}
  .hero h1{font-size:25px}
  h1{font-size:24px}
  .stats{grid-template-columns:1fr}
  .author{grid-template-columns:1fr;gap:18px}
  .author img{width:160px;height:160px}
  .books{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand" data-go="home">
      <small>LOGIC · GAME BOOK</small>
      <b>퀴즈와 퍼즐 게임으로<br>배우는 논리학</b>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">© 휴먼앤사이언스연구소 · 휴먼북스</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="topbar"><button id="menuBtn" aria-label="메뉴 열기">☰</button><span>퀴즈와 퍼즐 게임으로 배우는 논리학</span></div>
    <div class="content" id="view"></div>
  </main>
</div>

<script>
/* =========================================================
   메뉴 & 게임 데이터
   - 새 게임을 추가하려면 해당 장(chapter)의 games 배열에 항목을 넣으면 됩니다.
   - questions 가 있으면 바로 플레이 가능, 없으면 '준비 중'으로 표시됩니다.
   ========================================================= */
const CHAPTERS = [
  { id:"c1", part:"1부 논리적 사고", no:"1장", title:"논리학의 기본개념", desc:"논증의 뜻과 구조, 전제와 결론을 구별해 봅니다.", icon:"①",
    games:[
      { id:"c1g1", title:"논증 찾기 퀴즈", type:"퀴즈",
        questions:[
          { q:"다음 중 ‘논증’에 해당하는 것은?", opts:[
              "오늘은 날씨가 참 좋다.",
              "모든 사람은 죽는다. 소크라테스는 사람이다. 그러므로 소크라테스는 죽는다.",
              "창문 좀 닫아 줄래?",
              "와, 정말 멋진 그림이다!"], a:1,
            ex:"논증은 어떤 주장(결론)을 다른 주장(전제)으로 뒷받침하는 문장들의 묶음입니다. ‘그러므로’가 결론을 이끌고 있습니다." },
          { q:"다음 논증에서 결론은 무엇인가?", pass:"비가 오면 땅이 젖는다. 지금 비가 오고 있다. 따라서 땅이 젖는다.", opts:[
              "비가 오면 땅이 젖는다.","지금 비가 오고 있다.","땅이 젖는다.","결론이 없다."], a:2,
            ex:"‘따라서’ 뒤에 오는 문장이 결론입니다. 앞의 두 문장은 결론을 뒷받침하는 전제입니다." },
          { q:"다음 중 결론을 이끄는 표현(결론 지시어)이 아닌 것은?", opts:["그러므로","따라서","왜냐하면","그래서"], a:2,
            ex:"‘왜냐하면’은 뒤에 이유, 즉 전제가 온다는 것을 알려 주는 전제 지시어입니다." },
          { q:"다음 글은 논증인가?", pass:"철수는 아침에 일어나 세수를 하고, 밥을 먹은 뒤 학교에 갔다.", opts:[
              "논증이다 — 결론이 분명하다.","논증이 아니다 — 사건을 순서대로 서술했을 뿐이다."], a:1,
            ex:"전제로 결론을 뒷받침하려는 시도가 없으므로 논증이 아니라 서술(이야기)입니다." }
        ]},
      { id:"c1g2", title:"전제·결론 분류 퍼즐", type:"퍼즐" }
    ]},
  { id:"c2", part:"1부 논리적 사고", no:"2장", title:"논리, 사고, 언어", desc:"생각과 언어가 논리와 어떻게 맞물리는지 살펴봅니다.", icon:"②",
    games:[ { id:"c2g1", title:"언어의 기능 맞히기", type:"퀴즈" }, { id:"c2g2", title:"애매어·모호어 찾기", type:"게임" } ]},
  { id:"c3", part:"2부 논증의 종류", no:"3장", title:"연역논증", desc:"전제가 참이면 결론이 반드시 참이 되는 추론.", icon:"③",
    games:[ { id:"c3g1", title:"타당성 판정 게임", type:"게임" }, { id:"c3g2", title:"진리표 퍼즐", type:"퍼즐" } ]},
  { id:"c4", part:"2부 논증의 종류", no:"4장", title:"귀납논증", desc:"전제가 결론을 개연적으로 뒷받침하는 추론.", icon:"④",
    games:[ { id:"c4g1", title:"연역일까 귀납일까?", type:"퀴즈" }, { id:"c4g2", title:"귀납 강도 순위 퍼즐", type:"퍼즐" } ]},
  { id:"c5", part:"3부 논증의 평가", no:"5장", title:"연역적 오류", desc:"형식이 잘못되어 생기는 오류를 찾아냅니다.", icon:"⑤",
    games:[ { id:"c5g1", title:"형식적 오류 탐정", type:"게임" }, { id:"c5g2", title:"오류 이름 맞히기", type:"퀴즈" } ]},
  { id:"c6", part:"3부 논증의 평가", no:"6장", title:"귀납적 오류", desc:"성급한 일반화처럼 근거가 약한 추론을 가려냅니다.", icon:"⑥",
    games:[ { id:"c6g1", title:"귀납 오류 탐정", type:"게임" }, { id:"c6g2", title:"성급한 일반화 찾기", type:"퀴즈" } ]}
];

/* ---------- 진행 기록 (이 브라우저에만 저장) ---------- */
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("logic-progress")||"{}"); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem("logic-progress", JSON.stringify(v)); }catch(e){} }
};
let progress = store.get();

const allGames = CHAPTERS.flatMap(c => c.games.map(g => ({...g, ch:c})));
const findGame = id => allGames.find(g => g.id === id);

/* ---------- 사이드 메뉴 ---------- */
let current = "home";
function renderNav(){
  const nav = document.getElementById("nav");
  let h = `<button class="nav-item" data-go="home"><span class="ico">◧</span>대시보드</button>
           <button class="nav-item" data-go="author"><span class="ico">✎</span>지은이 소개</button>
           `;
  let part = "";
  for(const c of CHAPTERS){
    if(c.part !== part){ part = c.part; h += `<div class="nav-label">${part}</div>`; }
    const open = current.startsWith(c.id) ? " open" : "";
    h += `<div class="group${open}" data-group="${c.id}">
      <button class="nav-item" data-toggle="${c.id}"><span class="ico">${c.icon}</span>${c.title}<span class="caret">▶</span></button>
      <div class="sub">${c.games.map(g => {
        const st = progress[g.id] ? "done" : (g.questions ? "ready" : "");
        return `<button data-go="${g.id}"><span class="dot ${st}"></span>${g.title}</button>`;
      }).join("")}</div></div>`;
  }
  nav.innerHTML = h;
  nav.querySelectorAll("[data-go]").forEach(b => b.classList.toggle("active", b.dataset.go === current));
}
document.getElementById("nav").addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if(t){ t.parentElement.classList.toggle("open"); return; }
  const g = e.target.closest("[data-go]");
  if(g) go(g.dataset.go);
});
document.querySelector(".brand").addEventListener("click", () => go("home"));

/* 모바일 메뉴 */
const side = document.getElementById("side"), scrim = document.getElementById("scrim");
document.getElementById("menuBtn").onclick = () => { side.classList.add("open"); scrim.classList.add("show"); };
scrim.onclick = () => { side.classList.remove("open"); scrim.classList.remove("show"); };

/* ---------- 라우팅 ---------- */
function go(id){
  current = id;
  side.classList.remove("open"); scrim.classList.remove("show");
  if(location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  renderNav();
  const v = document.getElementById("view");
  if(id === "home") v.innerHTML = viewHome();
  else if(id === "author") v.innerHTML = viewAuthor();
  else { const g = findGame(id); if(g) startGame(g); else return go("home"); }
  window.scrollTo(0,0);
}

/* ---------- 대시보드 ---------- */
function viewHome(){
  const total = allGames.length, ready = allGames.filter(g => g.questions).length;
  const done = allGames.filter(g => progress[g.id]).length;
  const best = Object.values(progress);
  const avg = best.length ? Math.round(best.reduce((s,p) => s + p.score/p.total*100, 0) / best.length) : 0;
  const first = allGames.find(g => g.questions && !progress[g.id]) || allGames.find(g => g.questions);
  return `
  <section class="hero">
    <small>정영기 지음 · 휴먼북스</small>
    <h1>퀴즈와 퍼즐 게임으로<br>배우는 논리학</h1>
    <p>논리학은 외우는 과목이 아니라 직접 해 보며 익히는 기술입니다. 장마다 준비된 퀴즈와 퍼즐을 풀면서 논증을 읽고, 따지고, 바로잡는 힘을 길러 보세요.</p>
    <div class="btns">
      <button class="btn" onclick="go('${first.id}')">▶ 바로 시작하기</button>
      <button class="btn ghost" onclick="go('author')">지은이 소개</button>
    </div>
  </section>
  <div class="stats">
    <div class="stat"><b>${done} / ${total}</b><span>완료한 게임</span><div class="bar"><i style="width:${total?done/total*100:0}%"></i></div></div>
    <div class="stat"><b>${avg}점</b><span>평균 점수 (완료한 게임 기준)</span><div class="bar"><i style="width:${avg}%"></i></div></div>
    <div class="stat"><b>${ready}개</b><span>지금 플레이 가능 · 나머지는 준비 중</span><div class="bar"><i style="width:${total?ready/total*100:0}%"></i></div></div>
  </div>
  ${[...new Set(CHAPTERS.map(c => c.part))].map(pt => `<h2>${pt}</h2>
  <div class="grid">${CHAPTERS.filter(c => c.part === pt).map(c => {
    const d = c.games.filter(g => progress[g.id]).length;
    return `<button class="ch" onclick="go('${c.games[0].id}')">
      <div class="n">${c.no}</div><h3>${c.title}</h3><p>${c.desc}</p>

/* ---------- 퀴즈 엔진 ---------- */
function startGame(g){
  const v = document.getElementById("view");
  const head = `<div class="crumb">${g.ch.part} › ${g.ch.no} ${g.ch.title} › ${g.title}</div>`;
  if(!g.questions){
    v.innerHTML = `${head}<h1>${g.title}</h1>
      <div class="card soon"><div class="big">🧩</div><p><b>준비 중인 ${g.type}입니다.</b><br>곧 이곳에서 플레이할 수 있어요.</p>
      <button class="btn line" onclick="go('home')">대시보드로</button></div>`;
    return;
  }
  let i = 0, score = 0;
  const draw = () => {
    const q = g.questions[i];
    v.innerHTML = `${head}
      <div class="game-head"><h1 style="margin:0">${g.title}</h1>
        <span class="pill">문제 ${i+1} / ${g.questions.length} · 점수 ${score}</span></div>
      <div class="bar" style="margin-bottom:18px"><i style="width:${i/g.questions.length*100}%"></i></div>
      <div class="card">
        <p class="q">${q.q}${q.pass?`<span class="pass">${q.pass}</span>`:""}</p>
        <div class="opts">${q.opts.map((o,k) => `<button class="opt" data-k="${k}">${String.fromCharCode(9312+k)} ${o}</button>`).join("")}</div>
        <div class="explain" id="ex"></div>
        <div class="game-foot"><button class="btn" id="next" disabled>${i+1 < g.questions.length ? "다음 문제 →" : "결과 보기"}</button></div>
      </div>`;
    v.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, right = k === q.a;
      if(right) score++;
      v.querySelectorAll(".opt").forEach(x => { x.disabled = true; if(+x.dataset.k === q.a) x.classList.add("ok"); });
      if(!right) b.classList.add("bad");
      const ex = document.getElementById("ex");
      ex.innerHTML = `<b>${right ? "✔ 정답입니다!" : "✘ 아쉬워요."}</b> ${q.ex}`;
      ex.classList.add("show");
      document.getElementById("next").disabled = false;
    });
    document.getElementById("next").onclick = () => { i++; i < g.questions.length ? draw() : finish(); };
  };
  const finish = () => {
    const prev = progress[g.id];
    if(!prev || score > prev.score) progress[g.id] = { score, total:g.questions.length };
    store.set(progress); renderNav();
    const pct = Math.round(score / g.questions.length * 100);
    const msg = pct === 100 ? "완벽합니다! 논리의 눈이 밝으시네요." : pct >= 60 ? "잘했어요! 틀린 문제의 해설을 다시 살펴보세요." : "괜찮아요. 한 번 더 도전해 볼까요?";
    v.innerHTML = `${head}<h1>${g.title}</h1>
      <div class="card result"><div class="big">${score} / ${g.questions.length}</div>
      <p>${msg}</p>
      <div class="btns" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="go('${g.id}')">다시 풀기</button>
        <button class="btn line" onclick="go('home')">대시보드로</button></div></div>`;
  };
  draw();
}

window.addEventListener("hashchange", () => { const h = location.hash.slice(1) || "home"; if(h !== current) go(h); });
go(location.hash.slice(1) || "home");
</script>
